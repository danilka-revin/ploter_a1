<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="logo.png" />
    <title>JBD BMS — чтение и прошивка</title>
    <script>
      // Тема до первой отрисовки (без вспышки): тёмная по умолчанию, как в PSBees.
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('jbd.theme');
          if (s === 'light' || s === 'dark') t = s;
        } catch (e) { /* приватный режим */ }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
